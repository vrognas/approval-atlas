<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- GitHub Pages cannot set headers; a meta policy cannot set frame-ancestors (docs/mvsp.md). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1c19" media="(prefers-color-scheme: dark)" />
    <!-- Two of the files the search needs first (main.js FIRST_FILES), asked for with the page rather
         than once the script has run (bug hunt 2026-10-01: on Slow 4G they started 2.9 s in, after
         the theme script, the script and the stylesheet). They download while the theme script's
         round trip leaves the line idle; the MeSH terms (77 KB) would not fit there and would share
         the bandwidth with the stylesheet, delaying the first paint, so main.js asks for them.
         crossorigin: the same request as main.js's fetch(), so it reuses this response. -->
    <link rel="preload" href="/data/meta.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/ema_search_index.json" as="fetch" crossorigin />
    <!-- The viewer's chosen theme (data-theme) before the first paint: a classic script, as the CSP
         allows no inline script and a module runs after the first paint; before the stylesheet,
         so it runs as soon as it arrives. theme.js (the header's button) does the rest. -->
    <script src="/theme-init.js"></script>
    <title>Approval Atlas</title>
    <!-- The tagline (owner decision on the copy review, 2026-09-30): the bar no longer shows one, so
         it names the site in search results and shared links. -->
    <meta name="description" content="Look up the EU approval status of medicines authorized through EMA." />
    <!-- favicon.ico (16/32/48 PNGs) for clients that ask for it or cannot draw SVG; the SVG wins where supported. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS home screen: icon.svg full bleed at 180px (iOS rounds the corners itself). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The top bar (F · Spacious, phase 1; every width): the wordmark and the data's date, the
         lookup search, "What is this?" and the theme button. Phones: two rows, the search the
         second, which stays at the top while the page scrolls (below 1024px, sticky). -->
    <header class="topbar">
      <!-- The wordmark opens the overview (main.js); the icon is public/icon.svg's, drawn inline. Named
           by its text: "Approval Atlas, home, EMA data as of 29 Sep 2026" (the date is read too). -->
      <a id="home-link" class="brand" href="/"><svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="14" fill="#2B4A31" />
          <path d="M17 51 L32 13 L47 51" fill="none" stroke="#F3F3EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M21 37 L28 43 L44 27" fill="none" stroke="#D8B45A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        </svg><span class="brand-text"><span class="brand-name">Approval Atlas<span class="visually-hidden">, home, </span></span><span id="data-date" class="brand-date"></span></span></a>
      <section id="lookup" class="lookup" hidden>
        <label id="lookup-label" for="lookup-input" class="visually-hidden"></label>
        <div class="lookup-box">
          <input
            id="lookup-input"
            type="search"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="lookup-listbox"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="search"
            disabled
          />
          <div id="lookup-listbox" role="listbox" aria-labelledby="lookup-label" hidden></div>
        </div>
        <p id="lookup-status" class="visually-hidden" aria-live="polite"></p>
      </section>
      <!-- "What is this?" shows the intro card (intro.js); the theme button (Light, Dark) is filled
           by theme.js. -->
      <div class="topbar-actions">
        <button id="intro-link" class="inline-button" type="button"></button>
        <button id="theme-toggle" class="theme-toggle" type="button"></button>
      </div>
      <p id="offline-note" class="note" role="status" hidden></p>
    </header>

    <main>
      <p id="message" hidden></p>

      <!-- Under the top bar: the Try examples (hidden while the intro card shows). -->
      <p id="lookup-try" class="try" hidden></p>

      <!-- The landing intro (intro.js): on the untouched overview until closed; "What is this?" in
           the header brings it back. -->
      <section id="intro" class="intro" hidden></section>

      <section id="result" class="result" aria-label="Lookup result" hidden></section>

      <!-- Its text: main.js renderAbout() (labels.js UI.page.loading). -->
      <p id="app-loading" class="muted"></p>

      <div id="app" hidden>
        <!-- The page header (F · Spacious, phase 1): the heading, the answer headline as its lead
             paragraph (and the dek), Download CSV at the right; then the filter chips. While a
             lookup result is open the dashboard below it is the overview: the heading says so and
             a note replaces the lead. Under the heading (source-neutral, owner decision
             2026-09-30) the scope line names the sources the data has (labels.js SOURCES). -->
        <div class="page-head">
          <div class="page-head-row">
            <div class="page-head-text">
              <h1 id="page-title"></h1>
              <p id="page-scope" class="page-scope"></p>
              <div class="answer">
                <!-- The lead: the headline, then by default (owner decision 2026-09-29, "Authorized by
                     default") a quiet sentence on the medicines of other statuses and "Include them",
                     inline (F · Spacious mockup). -->
                <p class="page-lead"><span id="headline" class="headline" tabindex="-1"></span><span id="status-scope" class="status-scope" hidden> <span id="status-scope-text"></span> <button id="status-include" class="lead-button" type="button"></button></span></p>
                <p id="headline-dek" class="page-dek"></p>
                <div id="class-path" class="class-path neutral-badges" hidden></div>
              </div>
              <p id="explore-note" class="page-dek" hidden></p>
            </div>
            <!-- The table card has the same button (main.js); the table's caption says what it saves. -->
            <button id="page-download" class="more download" type="button" aria-describedby="table-caption"><svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg><span id="page-download-text"></span></button>
          </div>
          <p id="filter-result" class="visually-hidden" role="status"></p>

          <!-- One chip per filter dimension (filter-bar.js): each opens a popover under it
               (desktop, popover.js) or a bottom sheet (below 1024px). -->
          <div class="filter-bar" role="group" aria-labelledby="filter-bar-label">
            <span id="filter-bar-label" class="visually-hidden"></span>
            <div id="filter-chips" class="chip-row"></div>
            <p id="filter-summary" class="filter-summary" hidden></p>
            <dialog id="filter-popover" class="popover" aria-labelledby="popover-title" aria-describedby="popover-note">
              <div class="popover-head">
                <h2 id="popover-title" tabindex="-1"></h2>
                <p id="popover-note" class="popover-note"></p>
              </div>
              <div id="popover-body" class="popover-body"></div>
              <!-- Touch screens: the tip a tap shows in the body (setupTips() in main.js). -->
              <p class="tip-strip" aria-hidden="true" hidden></p>
              <div class="popover-foot">
                <button id="popover-clear" class="text-button" type="button"></button>
                <button id="popover-done" class="popover-done" type="button"></button>
              </div>
            </dialog>
          </div>
          <p id="url-note" class="note" role="status" hidden></p>
        </div>

        <!-- The tabs (F · Spacious, phase 2; the WAI-ARIA tabs pattern since 2026-09-30, owner
             decision): a tablist under the chip bar, which filters every tab; one tab stop (the tab
             shown), Left/Right/Home/End between tabs, Enter or Space shows one (manual activation:
             ?tab=…, pushState; tabs.js, main.js). Its name is set by main.js (UI.tabs.label).
             Phones: the strip scrolls sideways. Only the tab shown renders its cards. -->
        <div id="tabs" class="tabs" role="tablist">
          <button id="tab-button-overview" class="tab" type="button" role="tab" data-tab="overview" aria-controls="tab-overview" aria-selected="true"></button>
          <button id="tab-button-protection" class="tab" type="button" role="tab" data-tab="protection" aria-controls="tab-protection" aria-selected="false" tabindex="-1"></button>
          <button id="tab-button-classes" class="tab" type="button" role="tab" data-tab="classes" aria-controls="tab-classes" aria-selected="false" tabindex="-1"></button>
          <button id="tab-button-companies" class="tab" type="button" role="tab" data-tab="companies" aria-controls="tab-companies" aria-selected="false" tabindex="-1"></button>
          <button id="tab-button-years" class="tab" type="button" role="tab" data-tab="years" aria-controls="tab-years" aria-selected="false" tabindex="-1"></button>
          <button id="tab-button-medicines" class="tab" type="button" role="tab" data-tab="medicines" aria-controls="tab-medicines" aria-selected="false" tabindex="-1"></button>
        </div>

        <!-- The panels (role="tabpanel", named by their tab): each starts with a card title, not a
             control, so each is itself a tab stop (tabindex="0", as the APG pattern asks). -->
        <!-- Overview: "Authorized over time" with the type tiles, then small previews of the other
             tabs (the top companies, conditions and protection years), each with a link to its tab. -->
        <div id="tab-overview" class="tab-panel" role="tabpanel" aria-labelledby="tab-button-overview" tabindex="0" data-tab-panel="overview">
        <!-- One dashboard: every medicine matching the filters (by default the authorized ones:
             owner decision 2026-09-29). The top row
             (owner decision 2026-09-29, revised): "Authorized over time" across the main column,
             the four type tiles under it, in one row, 2 x 2 or one per row by the main column's
             width. The frame is their size container: the main column's width. -->
        <div class="top-row-frame">
          <div class="top-row">
            <section class="chart-card" aria-labelledby="over-time-title">
              <div class="card-head">
                <div class="card-title">
                  <h2 id="over-time-title">Authorized over time</h2>
                  <button class="info-button" type="button" aria-expanded="false" aria-controls="over-time-info" aria-describedby="over-time-title"><svg class="info-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" /><path d="M8 7.25v4M8 4.75v.25" /></svg></button>
                </div>
              </div>
              <p id="over-time-takeaway" class="card-takeaway"></p>
              <div id="over-time-info" class="card-info" hidden>
                <p id="over-time-subtitle" class="muted"></p>
                <p id="over-time-note" class="muted"></p>
              </div>
              <ul id="over-time-legend" class="legend"></ul>
              <div id="over-time" class="chart"></div>
            </section>
            <div id="tiles" class="tiles"></div>
          </div>
        </div>
        <p id="register-note" class="muted" hidden></p>
        <p id="undated-authorized" class="muted" hidden></p>

        <!-- Previews of the other tabs (overview-previews.js): three small cards side by side when
             there is room (their frame is a size container). -->
        <div class="previews-frame neutral-badges">
          <div class="previews">
            <section id="preview-companies" class="chart-card preview-card" aria-labelledby="preview-companies-title">
              <div class="preview-head">
                <h2 id="preview-companies-title"></h2>
                <a class="preview-tab-link" data-tab-link="companies" href="?tab=companies"></a>
              </div>
              <div class="preview-body"></div>
            </section>
            <section id="preview-conditions" class="chart-card preview-card" aria-labelledby="preview-conditions-title">
              <div class="preview-head">
                <h2 id="preview-conditions-title"></h2>
                <a class="preview-tab-link" data-tab-link="classes" href="?tab=classes"></a>
              </div>
              <div class="preview-body"></div>
            </section>
            <section id="preview-protection" class="chart-card preview-card" aria-labelledby="preview-protection-title">
              <div class="preview-head">
                <h2 id="preview-protection-title"></h2>
                <a class="preview-tab-link" data-tab-link="protection" href="?tab=protection"></a>
              </div>
              <div class="preview-body"></div>
            </section>
          </div>
        </div>
        </div>

        <!-- Protection: the estimated protection ending card. -->
        <div id="tab-protection" class="tab-panel" role="tabpanel" aria-labelledby="tab-button-protection" tabindex="0" data-tab-panel="protection" hidden>
        <!-- Draft (loss-of-exclusivity calendar; protection-calendar-card.js): currently authorized
             medicines by the year their estimated market protection ends at the earliest. -->
        <section id="protection-calendar" class="chart-card neutral-badges" aria-labelledby="pc-title">
          <div class="card-head">
            <div class="card-title">
              <h2 id="pc-title"></h2>
              <button class="info-button" type="button" aria-expanded="false" aria-controls="pc-info" aria-describedby="pc-title"><svg class="info-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" /><path d="M8 7.25v4M8 4.75v.25" /></svg></button>
            </div>
          </div>
          <p id="pc-takeaway" class="card-takeaway"></p>
          <div id="pc-info" class="card-info" hidden>
            <p id="pc-note" class="muted"></p>
          </div>
          <div id="pc-body"></div>
        </section>
        </div>

        <!-- Classes and areas: the breakdown (ATC, therapeutic area, company or modality) and the
             conditions card. -->
        <div id="tab-classes" class="tab-panel" role="tabpanel" aria-labelledby="tab-button-classes" tabindex="0" data-tab-panel="classes" hidden>
        <section class="chart-card neutral-badges" aria-labelledby="breakdown-title">
          <div class="card-head">
            <div class="card-title">
              <h2 id="breakdown-title"></h2>
              <button class="info-button" type="button" aria-expanded="false" aria-controls="breakdown-info" aria-describedby="breakdown-title"><svg class="info-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" /><path d="M8 7.25v4M8 4.75v.25" /></svg></button>
            </div>
            <div class="card-head-tools">
              <div id="breakdown-by" class="segmented" role="group" aria-label="Break down by">
                <button type="button" data-by="atc">ATC</button>
                <button type="button" data-by="area">Therapeutic area</button>
                <button type="button" data-by="mah">Company</button>
                <button type="button" data-by="mod" hidden>Modality</button>
              </div>
              <button class="view-options-button" type="button" aria-expanded="false" aria-controls="breakdown-options" aria-describedby="breakdown-title"><svg class="view-options-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 4h7M13 4h1M2 12h1M7 12h7" /><circle cx="11" cy="4" r="2" /><circle cx="5" cy="12" r="2" /></svg><span class="view-options-text"></span><svg class="view-options-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 6l4 4 4-4" /></svg></button>
            </div>
          </div>
          <p id="breakdown-takeaway" class="card-takeaway"></p>
          <div id="breakdown-options" class="view-options" hidden>
            <div class="card-tools">
              <span id="breakdown-sort-label" class="tools-label"></span>
              <div id="breakdown-sort" class="segmented segmented-small" role="group" aria-labelledby="breakdown-sort-label">
                <button type="button" data-sort="count"></button>
                <button type="button" data-sort="key"></button>
              </div>
            </div>
          </div>
          <div id="breakdown-info" class="card-info" hidden>
            <p id="breakdown-note" class="muted"></p>
            <p id="breakdown-excluded" class="muted" hidden></p>
          </div>
          <ul id="breakdown-legend" class="legend" hidden></ul>
          <div id="breakdown-path" class="breakdown-path" hidden></div>
          <div id="breakdown" class="breakdown"></div>
        </section>

        <!-- The conditions of the medicines shown (every one without a filter), ranked by treatments or authorized medicines (conditions-card.js); each opens its condition page. -->
        <section id="conditions" class="chart-card conditions-card" aria-labelledby="conditions-title">
          <div class="card-head">
            <div class="card-title">
              <h2 id="conditions-title"></h2>
              <button class="info-button" type="button" aria-expanded="false" aria-controls="conditions-info" aria-describedby="conditions-title"><svg class="info-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" /><path d="M8 7.25v4M8 4.75v.25" /></svg></button>
            </div>
          </div>
          <p id="conditions-takeaway" class="card-takeaway"></p>
          <div id="conditions-info" class="card-info" hidden>
            <p id="conditions-subtitle" class="muted"></p>
          </div>
          <table id="conditions-table" class="conditions-table" role="table" aria-labelledby="conditions-title" aria-describedby="conditions-subtitle" hidden></table>
          <button id="conditions-more" class="text-button" type="button" hidden></button>
          <p id="conditions-unlisted" class="muted"></p>
          <p id="conditions-empty" class="muted"></p>
        </section>
        </div>

        <!-- Companies: who is active where, the top company groups by ATC group or therapeutic area group. -->
        <div id="tab-companies" class="tab-panel" role="tabpanel" aria-labelledby="tab-button-companies" tabindex="0" data-tab-panel="companies" hidden>
        <section class="chart-card neutral-badges" aria-labelledby="activity-title">
          <div class="card-head">
            <div class="card-title">
              <h2 id="activity-title"></h2>
              <button class="info-button" type="button" aria-expanded="false" aria-controls="activity-info" aria-describedby="activity-title"><svg class="info-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" /><path d="M8 7.25v4M8 4.75v.25" /></svg></button>
            </div>
            <button class="view-options-button" type="button" aria-expanded="false" aria-controls="activity-options" aria-describedby="activity-title"><svg class="view-options-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 4h7M13 4h1M2 12h1M7 12h7" /><circle cx="11" cy="4" r="2" /><circle cx="5" cy="12" r="2" /></svg><span class="view-options-text"></span><svg class="view-options-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 6l4 4 4-4" /></svg></button>
          </div>
          <p id="activity-takeaway" class="card-takeaway"></p>
          <div id="activity-options" class="view-options" hidden>
            <div class="card-tools">
              <span id="activity-by-label" class="tools-label"></span>
              <div id="activity-by" class="segmented segmented-small" role="group" aria-labelledby="activity-by-label">
                <button type="button" data-mode="atc"></button>
                <button type="button" data-mode="area"></button>
              </div>
            </div>
            <div class="card-tools">
              <span id="activity-order-label" class="tools-label"></span>
              <div id="activity-order" class="segmented segmented-small" role="group" aria-labelledby="activity-order-label">
                <button type="button" data-order="key"></button>
                <button type="button" data-order="count"></button>
              </div>
            </div>
          </div>
          <div id="activity-info" class="card-info" hidden>
            <p id="activity-subtitle" class="muted"></p>
            <p id="activity-note" class="muted"></p>
          </div>
          <div id="activity-table" class="activity-scroll"></div>
          <!-- Touch screens: the ATC columns' names (their tooltips never show there). -->
          <p id="activity-legend" class="muted activity-legend" aria-hidden="true"></p>
        </section>
        </div>

        <!-- By year: approvals per year, stacked by medicine type, ATC class, company group, status or modality (UI state). -->
        <div id="tab-years" class="tab-panel" role="tabpanel" aria-labelledby="tab-button-years" tabindex="0" data-tab-panel="years" hidden>
        <section class="chart-card" aria-labelledby="chart-title">
          <div class="card-head">
            <div class="card-title">
              <h2 id="chart-title">Medicines by year of approval</h2>
              <button class="info-button" type="button" aria-expanded="false" aria-controls="chart-info" aria-describedby="chart-title"><svg class="info-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" /><path d="M8 7.25v4M8 4.75v.25" /></svg></button>
            </div>
            <button class="view-options-button" type="button" aria-expanded="false" aria-controls="chart-options" aria-describedby="chart-title"><svg class="view-options-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 4h7M13 4h1M2 12h1M7 12h7" /><circle cx="11" cy="4" r="2" /><circle cx="5" cy="12" r="2" /></svg><span class="view-options-text"></span><svg class="view-options-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 6l4 4 4-4" /></svg></button>
          </div>
          <p id="chart-takeaway" class="card-takeaway"></p>
          <div id="chart-options" class="view-options" hidden>
            <div class="card-tools">
              <span id="chart-stack-label" class="tools-label"></span>
              <div id="chart-stack" class="segmented segmented-small" role="group" aria-labelledby="chart-stack-label">
                <button type="button" data-stack="type"></button>
                <button type="button" data-stack="atc"></button>
                <button type="button" data-stack="mah"></button>
                <button type="button" data-stack="status"></button>
                <button type="button" data-stack="mod" hidden></button>
              </div>
            </div>
            <!-- Status is offered only with the status filter widened (owner decision 2026-09-30):
                 under the default, this says how, its button widening the filter. -->
            <p id="chart-stack-hint" class="view-options-hint" hidden><button id="chart-stack-widen" class="lead-button" type="button"></button><span id="chart-stack-hint-after"></span></p>
          </div>
          <div id="chart-info" class="card-info" hidden>
            <p id="chart-note" class="muted"></p>
            <p id="undated-note" class="muted"></p>
          </div>
          <div class="legend-row">
            <ul id="legend" class="legend stack-legend"></ul>
            <output id="year-readout" class="readout" aria-live="polite"></output>
          </div>
          <div id="chart" class="chart"></div>
        </section>
        </div>

        <!-- Medicines: the table with Download CSV. -->
        <div id="tab-medicines" class="tab-panel" role="tabpanel" aria-labelledby="tab-button-medicines" tabindex="0" data-tab-panel="medicines" hidden>
        <section class="chart-card table-card neutral-badges" aria-labelledby="table-title">
          <!-- "Download CSV" (main.js, csv.js): every medicine the table lists; the caption says which. -->
          <div class="card-head">
            <h2 id="table-title">Medicines</h2>
            <!-- The page header's button's look (design sweep 2026-10-01, B2): one Download CSV look. -->
            <button id="table-download" class="more download" type="button" aria-describedby="table-caption"><svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg><span id="table-download-text"></span></button>
          </div>
          <p id="table-caption" class="table-caption"></p>
          <div class="table-scroll">
            <table id="medicines-table"></table>
          </div>
          <button id="table-more" class="text-button" type="button" hidden></button>
        </section>
        </div>
      </div>
    </main>

    <!-- The facet sections (F · Spacious, phase 1): kept here, hidden, and borrowed by a chip's
         popover (desktop, popover.js) or sheet (below 1024px, sheet.js) while it is open; the
         dialog's title names the section. -->
    <div id="facet-store" hidden>
      <div id="facet-type" class="facet">
        <ul class="facet-list"></ul>
      </div>
      <!-- One tree (M2 phase 2): modality group › modality (modality-tree.js); its chip shows once
           the modality data has loaded. -->
      <div id="facet-modality" class="facet">
        <input id="modality-search" class="facet-search" type="search" autocomplete="off" spellcheck="false" />
        <p class="facet-live visually-hidden" role="status"></p>
        <ul id="modality-tree" class="atc-tree modality-tree"></ul>
        <p class="facet-empty muted" hidden></p>
        <p class="muted atc-note tree-note"></p>
      </div>
      <div id="facet-atc" class="facet">
        <input id="atc-search" class="facet-search" type="search" autocomplete="off" spellcheck="false" />
        <p class="facet-live visually-hidden" role="status"></p>
        <p id="atc-names" class="muted tree-names" hidden></p>
        <ul id="atc-tree" class="atc-tree"></ul>
        <p class="facet-empty muted" hidden></p>
        <p class="muted atc-note"></p>
      </div>
      <!-- One tree (phase 4f): MeSH category › branch › level 2 › level 3 › EMA's terms (area-tree.js). -->
      <div id="facet-area" class="facet">
        <input id="area-search" class="facet-search" type="search" autocomplete="off" spellcheck="false" />
        <p class="facet-live visually-hidden" role="status"></p>
        <p id="area-tags" class="muted tree-names" hidden></p>
        <ul id="area-tree" class="atc-tree area-tree"></ul>
        <p class="facet-empty muted" hidden></p>
        <p class="muted atc-note tree-note"></p>
      </div>
      <!-- One tree (companies part 2): company group › company › EMA holder name (company-tree.js). -->
      <div id="facet-mah" class="facet">
        <input id="company-search" class="facet-search" type="search" autocomplete="off" spellcheck="false" />
        <p class="facet-live visually-hidden" role="status"></p>
        <ul id="company-tree" class="atc-tree company-tree"></ul>
        <p class="facet-empty muted" hidden></p>
        <button class="facet-more text-button" type="button" hidden></button>
        <p class="muted atc-note tree-note"></p>
      </div>
      <div id="facet-status" class="facet">
        <ul class="facet-list"></ul>
        <!-- Include every status, or back to the default (authorized): facet-panel.js. -->
        <button id="status-widen" class="text-button status-widen" type="button"></button>
      </div>
      <!-- Approval year: slim one-colour per-year bars above a two-thumb slider (year-slider.js; the
           status stacks are "Approvals per year", Stack by Status). -->
      <div id="facet-years" class="facet">
        <div id="year-hist" class="year-hist" aria-hidden="true"></div>
        <p id="year-hist-summary" class="visually-hidden"></p>
        <p class="year-values" aria-hidden="true"><span id="year-start-value"></span><span id="year-end-value"></span></p>
        <div class="year-slider">
          <div class="year-track" aria-hidden="true"><span class="year-track-fill"></span></div>
          <input id="year-start" type="range" />
          <input id="year-end" type="range" />
        </div>
      </div>
    </div>

    <!-- Phones and tablets: a bottom sheet (showModal) with the section of one chip. -->
    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title" aria-describedby="sheet-note">
      <div class="sheet-head">
        <h2 id="sheet-title" tabindex="-1"></h2>
        <!-- Under the title, as the popover's (design sweep 2026-10-01, B11): what the counts count.
             A row of its own across the head, so Clear and × stay on the title's line. -->
        <p id="sheet-note" class="popover-note"></p>
        <button id="sheet-clear" class="text-button" type="button"></button>
        <button id="sheet-close" class="sheet-close" type="button"></button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
      <!-- Touch screens: the tip a tap shows in the body (setupTips() in main.js). -->
      <p class="tip-strip" aria-hidden="true" hidden></p>
      <div class="sheet-foot">
        <button id="sheet-done" class="primary" type="button"></button>
      </div>
      <p id="sheet-status" class="visually-hidden" role="status"></p>
    </dialog>

    <footer>
      <details class="about">
        <summary id="about-summary"></summary>
        <div id="about-body"></div>
      </details>
      <!-- Three lines (legal review 2026-09-30): every source's credit with its licence links, the
           intended use and non-affiliation, the site's own licences and contact. Filled by main.js
           renderFooter() from labels.js (UI.footer), with links built in the DOM. -->
      <p id="footer-sources"></p>
      <p id="footer-use"></p>
      <p id="footer-licence"></p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
