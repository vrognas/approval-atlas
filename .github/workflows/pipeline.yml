name: pipeline

on:
  # UTC. After EMA's 06:00 Amsterdam refresh in both CET and CEST; off the hour to avoid schedule delays.
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time: parallel runs would double the requests to rate-limited sources.
concurrency:
  group: pipeline
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (tag in the comment); Dependabot updates both.
jobs:
  build:
    # Pinned: ubuntu-latest moves to 26.04 during Oct-Nov 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # .lintr's error_on_lint is reset by lintr before it is checked; the env var is honoured.
      LINTR_ERROR_ON_LINT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: renv

      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          # Keep the package cache even when validation fails, so the next run is fast.
          bypass-cache: never

      - name: Lint R
        run: Rscript -e 'pkgload::load_all(quiet = TRUE); lintr::lint_package()'

      - name: Test R
        run: Rscript -e 'testthat::test_local()'

      # Rolling key: each run restores the newest cache and saves an updated copy,
      # so MeSH and ChEMBL are refetched only when their source changes and the
      # EPAR documents index, orphan designations and Union Register get one
      # conditional GET per run (sidecars restored with old mtimes; R/http.R).
      - name: Restore download cache
        id: restore-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/downloads
          key: downloads-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: downloads-v1-

      - name: Run EMA pipeline
        id: pipeline
        run: Rscript scripts/run-pipeline.R

      # Save even when validation fails, so finished downloads are not repeated.
      - name: Save download cache
        if: always() && steps.pipeline.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/downloads
          key: ${{ steps.restore-downloads.outputs.cache-primary-key }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Runtime dependencies only: they ship to the site; dev tools (Vite) do not.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

      # For the commit-data job (and to inspect a run's data).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data
          path: site/public/data
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Commits refreshed data ("git scraping"): a history of EMA changes, and repository activity
  # that keeps the schedule enabled (GitHub disables it after 60 days without activity).
  # A push made with GITHUB_TOKEN does not trigger the push workflow, so this cannot loop.
  commit-data:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mirror the run's data exactly, so a file the pipeline no longer writes is deleted too.
      - run: rm -rf site/public/data

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: data
          path: site/public/data

      # meta.json (retrieval dates) and the series' last row (the snapshot date) change on every
      # run, so they alone are not worth a commit; they are committed with any real change.
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/data
          git diff --cached --quiet -- site/public/data ':(exclude)site/public/data/meta.json' ':(exclude)site/public/data/ema_authorized_series.json' || {
            git commit -m "chore: Refresh EMA data"
            git pull --rebase origin main
            git push origin HEAD:main
          }
